# ScopeCraft — local development services (owner: Yousef).
#
# WHAT THIS IS FOR
# A real Postgres with no signup, in one command, plus a database that
# integration tests can actually touch. It is NOT the production deploy path:
# Vercel does not build from this file or from the Dockerfile. Production still
# deploys with `git push fork dev:main` and still needs a hosted Postgres.
#
#   docker compose up -d db     start the database
#   docker compose down         stop it, keep the data
#   docker compose down -v      stop it and destroy the data
#
# There is deliberately no `version:` key — Compose v2 ignores it and warns.

services:
  db:
    image: postgres:16-alpine
    container_name: scopecraft-db

    # Local-only credentials for a database published on localhost. They are
    # readable defaults on purpose: there is no secret here worth protecting,
    # and a developer who cannot guess the password cannot open a psql shell.
    # Overridable through a compose `.env` file (gitignored) if anyone needs to.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scopecraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scopecraft}
      POSTGRES_DB: ${POSTGRES_DB:-scopecraft}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      # Named volume, so `docker compose down` keeps the data. Without this,
      # every restart silently wipes the database, which reads as a bug rather
      # than as cleanliness. `down -v` is the deliberate way to reset.
      - db-data:/var/lib/postgresql/data

      # Postgres runs everything in this directory ONCE, on first start, and
      # only when the data directory is empty. Editing schema.sql afterwards
      # does nothing until `docker compose down -v` — this is the single most
      # common confusion with a containerised Postgres, so it is written down
      # rather than rediscovered.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    # Without a healthcheck, anything with `depends_on` races the container's
    # startup and fails on the first run only — the worst kind of flake,
    # because the retry passes and hides it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scopecraft} -d ${POSTGRES_DB:-scopecraft}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

  # The application image. Day-to-day work does not need this — run the app on
  # the host against the `db` service above, which is faster than a bind-mounted
  # rebuild on macOS. This service exists to verify the image actually works and
  # to give a portable one-command demo.
  #
  #   docker compose up -d          database + app
  #   docker compose up -d db       database only, app on the host
  web:
    build:
      context: .
    image: scopecraft:local
    container_name: scopecraft-web
    ports:
      - "${WEB_PORT:-3000}:3000"

    environment:
      # `db` is the compose service name, which is also its hostname on the
      # default network. Not `localhost` — inside the container that is the
      # container itself, which is the mistake this line exists to prevent.
      DATABASE_URL: "postgres://${POSTGRES_USER:-scopecraft}:${POSTGRES_PASSWORD:-scopecraft}@db:5432/${POSTGRES_DB:-scopecraft}"

      # No defaults, deliberately. A committed fallback secret is a secret that
      # ships; `:?` fails the start with this message instead. Generate one with
      # `npx auth secret` and put it in a compose `.env` file (gitignored).
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET in .env — generate one with npx auth secret}"
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_GITHUB_ID: "${AUTH_GITHUB_ID:?set AUTH_GITHUB_ID in .env}"
      AUTH_GITHUB_SECRET: "${AUTH_GITHUB_SECRET:?set AUTH_GITHUB_SECRET in .env}"

      # Passed through rather than defaulted. A missing provider key is skipped
      # by the failover chain, so the app still starts with none of them set —
      # it just cannot generate.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PRIMARY_AI_PROVIDER: ${PRIMARY_AI_PROVIDER:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
      DAILY_PLAN_LIMIT: ${DAILY_PLAN_LIMIT:-}

    # Waits for the healthcheck above, not merely for the container to exist.
    # Without `condition: service_healthy` this races Postgres' startup and
    # fails on a first run only — which the retry then hides.
    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

volumes:
  db-data:
